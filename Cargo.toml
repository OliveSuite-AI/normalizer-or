[package]
name = "normalizer-or"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Bounded Odia text-to-speech normalization with original-source diagnostics"
repository = "https://github.com/OliveSuite-AI/normalizer-or"
license = "Apache-2.0"
keywords = ["odia", "tts", "normalization", "text-to-speech"]
categories = ["text-processing"]
publish = ["crates-io"]
include = ["/src/**", "/tests/**", "/examples/**", "/benches/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/PERFORMANCE.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "!**/__pycache__/**"]

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "latency"
harness = false
required-features = ["serde"]

[[example]]
name = "contract-probe"
path = "tests/support/contract_probe.rs"
required-features = ["serde"]

[features]
default = []
serde = ["dep:serde"]

[workspace]
members = ["bindings/python"]
default-members = ["."]
resolver = "3"

[dependencies]
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
serde = { version = "=1.0.229", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "=1.12.0"
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
