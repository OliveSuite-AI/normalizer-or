name: Build Odia release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.99.0'
      - run: python -m pip install -c bindings/python/requirements-dev.txt maturin pytest
      - run: cargo test --locked --all-features
      - run: python -m maturin build --locked --release --sdist --manifest-path bindings/python/Cargo.toml --interpreter python --out target/release-artifacts
      - name: Test exact wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel, = pathlib.Path('target/release-artifacts').glob('*.whl')
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)], check=True)
          subprocess.run([sys.executable, '-m', 'pytest', 'bindings/python/tests', '-q'], check=True)
      - run: cargo package --locked -p normalizer-or
      - name: Upload build artifacts (no registry publication)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: normalizer-or-artifacts
          path: |
            target/release-artifacts/*
            target/package/normalizer-or-*.crate
