name: Odia CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.99.0'
  PROPTEST_CASES: "512"
  PROPTEST_RNG_SEED: "1729"
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked -p normalizer-or
      - run: python3 scripts/check_vocabulary.py
      - run: cargo bench --locked --features serde --bench latency --no-run
      - name: Preserve Rust counterexamples
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: robustness-rust-core
          path: |
            tests/*.proptest-regressions
            src/**/*.proptest-regressions

  msrv:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.94.0'
      - run: cargo test --locked --all-features
      - name: Preserve MSRV counterexamples
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: robustness-rust-msrv
          path: |
            tests/*.proptest-regressions
            src/**/*.proptest-regressions

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.99.0'
      - run: python -m pip install -c bindings/python/requirements-dev.txt maturin pytest ruff mypy
      - run: python -m ruff check bindings/python scripts
      - run: python -m ruff format --check bindings/python scripts
      - run: python -m mypy bindings/python/python --check-untyped-defs
      - run: python -m maturin build --locked --release --manifest-path bindings/python/Cargo.toml --interpreter python --out target/wheels
      - name: Install the built wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheels = list(pathlib.Path('target/wheels').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True)
      - run: python -m pytest bindings/python/tests -q
      - run: cargo build --locked --features serde --example contract-probe
      - run: python -m scripts.robustness --seed 1729
      - name: Preserve reproducible failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: robustness-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            target/robustness/
            tests/*.proptest-regressions
            src/**/*.proptest-regressions
